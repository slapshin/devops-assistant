name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Python comes from backend/.python-version; uv matches docs/DECISIONS.md and the Dockerfile.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --locked

      # Same steps as `make check-backend`, split so each shows separately.
      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Contract drift
        run: uv run python -m scripts.export_schemas --check

      - name: Fixture drift
        run: uv run python -m scripts.generate_fixtures --check

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Check (API-type drift, vue-tsc, eslint, vitest, build)
        run: make check-frontend

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Publish from main and version tags only; pull requests just build and smoke-test.
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # main → :latest, :main, :sha-<short>; tag v1.2.3 → :1.2.3, :1.2.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # :latest follows main, not the newest version tag.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: devops/docker/Dockerfile
          tags: devops-ai-assistant:ci
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name assistant -p 8000:8000 \
            -e DEMO_PROJECTS=true -e AI_PROVIDER=fake devops-ai-assistant:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs assistant
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f assistant || true

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the smoke-tested build, so every layer comes from the cache.
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: devops/docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          cache-from: type=gha
