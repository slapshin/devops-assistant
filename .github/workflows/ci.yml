name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Python comes from backend/.python-version; uv matches docs/DECISIONS.md and the Dockerfile.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: cd backend && uv sync --locked

      - name: Check (ruff, mypy, contract/fixture drift, pytest)
        run: make check-backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Check (API-type drift, vue-tsc, eslint, vitest, build)
        run: make check-frontend

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: devops/docker/Dockerfile
          tags: devops-ai-assistant:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name assistant -p 8000:8000 \
            -e DEMO_PROJECTS=true -e AI_PROVIDER=fake devops-ai-assistant:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs assistant
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f assistant || true
